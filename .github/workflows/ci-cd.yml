name: Release Helpdesk delivery
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taskboard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security:
    name: Source, dependency and secret gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v5
        with: {node-version: '24', cache: npm, cache-dependency-path: application/frontend/package-lock.json}
      - name: Install pinned source and dependency scanners
        run: pip install -r security/requirements.txt
      - name: Install checksum-verified Gitleaks
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --output /tmp/gitleaks-checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          expected=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' /tmp/gitleaks-checksums.txt)
          echo "$expected  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: SAST — Python and frontend
        run: bash scripts/security-scan.sh sast
      - name: SCA — Python and JavaScript lockfiles
        if: ${{ !cancelled() }}
        run: bash scripts/security-scan.sh sca
      - name: Secrets — full history and working tree
        if: ${{ !cancelled() }}
        run: bash scripts/security-scan.sh secrets
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: source-security-${{ github.sha }}
          path: evidence/logs/security-final/
          if-no-files-found: error
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskboard_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d taskboard_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/taskboard_test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/taskboard_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Install pinned backend dependencies
        run: pip install -r application/backend/requirements.txt
      - name: Migrate clean PostgreSQL and run tests
        working-directory: application/backend
        run: |
          alembic upgrade head
          alembic check
          pytest -v
      - name: Test Free Tier deployment guard
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/setup-node@v5
        with: {node-version: '24', cache: npm, cache-dependency-path: application/frontend/package-lock.json}
      - name: Build frontend
        working-directory: application/frontend
        run: |
          npm ci
          npm run build
      - name: Validate Compose
        run: docker compose config --quiet
      - uses: azure/setup-helm@v5.0.1
        with: {version: v3.21.3}
      - name: Validate Helm and GitOps manifests
        run: |
          helm lint helm/taskboard
          helm template taskboard helm/taskboard -f helm/taskboard/values-prod.yaml > /tmp/helm-aws.yaml
          kubectl kustomize gitops/releases > /tmp/gitops.yaml
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.16.6', terraform_wrapper: false}
      - name: Validate Terraform without provisioning
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform validate -no-color
  build-scan-push:
    needs: [test, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Resolve lowercase immutable image names
        run: |
          echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build both images
        run: |
          docker build --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" -f docker/backend.Dockerfile -t "$IMAGE_BASE-backend:$GITHUB_SHA" application/backend
          docker build --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" -f docker/frontend.Dockerfile -t "$IMAGE_BASE-frontend:$GITHUB_SHA" application/frontend
      - name: Scan both images (gate on all HIGH and CRITICAL findings)
        run: |
          mkdir -p scan-results
          failed=0
          for component in backend frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/scan-results:/reports" aquasec/trivy:0.76.0 image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output "/reports/$component.json" "$IMAGE_BASE-$component:$GITHUB_SHA" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: trivy-${{ github.sha }}
          path: scan-results/
      - uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_BASE-backend:$GITHUB_SHA"
          docker push "$IMAGE_BASE-frontend:$GITHUB_SHA"
  deploy:
    needs: build-scan-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: azure/setup-kubectl@v5.2.0
        with: {version: v1.35.0}
      - uses: azure/setup-helm@v5.0.1
        with: {version: v3.21.3}
      - name: Verify AWS CLI and configure EKS authentication
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws --version
          python3 scripts/check-free-tier.py --account 835582727900
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          kubectl auth can-i create deployments -n taskboard | grep -x yes
      - name: Deploy this commit and verify rollouts
        run: |
          export IMAGE_BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          scripts/deploy.sh "$GITHUB_SHA"
