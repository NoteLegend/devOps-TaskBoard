name: taskboard-tests
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskboard_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U test -d taskboard_test']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs: [/var/lib/postgresql/data]
  tests:
    build:
      context: ./application/backend
      dockerfile: ../../docker/backend.Dockerfile
    image: taskboard-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://test:test@postgres:5432/taskboard_test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@postgres:5432/taskboard_test
      PYTEST_ADDOPTS: -p no:cacheprovider
    volumes:
      - ./application/backend/tests:/app/tests:ro
      - ./application/backend/pytest.ini:/app/pytest.ini:ro
    depends_on:
      postgres: {condition: service_healthy}
    command: [sh, -c, 'alembic upgrade head && alembic check && pytest -v']
