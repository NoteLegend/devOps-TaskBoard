apiVersion: apps/v1
kind: Deployment
metadata: {name: diagnostic-web, namespace: taskboard-troubleshooting}
spec:
  replicas: 1
  selector: {matchLabels: {app: diagnostic-web}}
  template:
    metadata: {labels: {app: diagnostic-web}}
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:this-tag-does-not-exist
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
