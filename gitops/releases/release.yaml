apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: release-helpdesk
  namespace: release-helpdesk-gitops
spec:
  interval: 30s
  timeout: 6m
  releaseName: release-helpdesk
  chart:
    spec:
      chart: ./helm/taskboard
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: release-helpdesk
        namespace: flux-system
  install:
    # The post-install migration needs PostgreSQL created before API readiness.
    disableWait: true
    remediation:
      retries: 2
  upgrade:
    disableWait: true
    remediation:
      retries: 2
  driftDetection:
    mode: enabled
    ignore:
      # HPA owns backend replicas. Git continues to own frontend replicas.
      - paths: [/spec/replicas]
        target:
          kind: Deployment
          name: release-helpdesk-backend
  values:
    frontend:
      image: ghcr.io/notelegend/devops-taskboard-frontend
      tag: 179ad20c5e4995bf458a33531905d6f0e694b580
    backend:
      image: ghcr.io/notelegend/devops-taskboard-backend
      tag: 179ad20c5e4995bf458a33531905d6f0e694b580
    imagePullPolicy: Always
    replicaCount: 2
    releaseMarker: gitops-v1
    secretName: taskboard-runtime
    postgres:
      storageClass: standard
    ingress:
      enabled: false
    monitoring:
      serviceMonitor:
        enabled: true
