apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: release-helpdesk
  namespace: flux-system
spec:
  interval: 30s
  url: https://github.com/NoteLegend/devOps-TaskBoard.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: release-helpdesk
  namespace: flux-system
spec:
  interval: 30s
  retryInterval: 15s
  timeout: 6m
  path: ./gitops/releases
  prune: true
  sourceRef:
    kind: GitRepository
    name: release-helpdesk
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: release-helpdesk
      namespace: release-helpdesk-gitops
