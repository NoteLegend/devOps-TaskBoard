apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: "{{ .Release.Name }}-frontend"}
  template:
    metadata:
      labels: {app: "{{ .Release.Name }}-frontend"}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, fsGroup: 101}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
      volumes:
        - name: nginx-config
          configMap: {name: {{ .Release.Name }}-nginx}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels: {app: "{{ .Release.Name }}-frontend"}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  selector: {app: "{{ .Release.Name }}-frontend"}
  ports: [{name: http, port: 8080, targetPort: http}]
