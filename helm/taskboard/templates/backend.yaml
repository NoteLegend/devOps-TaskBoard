apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
spec:
{{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
{{- end }}
  selector:
    matchLabels: {app: "{{ .Release.Name }}-backend"}
  template:
    metadata:
      labels: {app: "{{ .Release.Name }}-backend"}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          lifecycle:
            preStop:
              exec:
                command: [python, -c, "import time; time.sleep(5)"]
          ports: [{name: http, containerPort: 8000}]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: DATABASE_URL}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          startupProbe: {httpGet: {path: /health, port: http}, failureThreshold: 30, periodSeconds: 5}
          resources:
{{ toYaml .Values.resources | indent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels: {app: "{{ .Release.Name }}-backend"}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  selector: {app: "{{ .Release.Name }}-backend"}
  ports: [{name: http, port: 8000, targetPort: http}]
