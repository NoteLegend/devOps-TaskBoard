frontend:
  image: taskboard-frontend
  tag: local
backend:
  image: taskboard-backend
  tag: local
replicaCount: 2
releaseMarker: release-helpdesk
imagePullPolicy: IfNotPresent
imagePullSecrets: []
secretName: taskboard-runtime
postgres:
  image: postgres:16-alpine
  database: taskboard
  storage: 5Gi
  storageClass: ""
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}
ingress:
  enabled: false
  className: traefik
  host: ""
  annotations: {}
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60
monitoring:
  serviceMonitor:
    enabled: false
