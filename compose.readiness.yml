name: taskboard-readiness
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: readiness, POSTGRES_USER: test, POSTGRES_PASSWORD: test}
    volumes: [readiness-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U test -d readiness']
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    image: taskboard-backend:local
    command: [alembic, upgrade, head]
    environment: &db
      DATABASE_URL: postgresql+psycopg://test:test@postgres:5432/readiness
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    image: taskboard-backend:local
    environment: *db
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  readiness-data:
